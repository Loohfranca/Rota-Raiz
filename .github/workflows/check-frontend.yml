name: Check frontend build
on:
  push:
    branches: [feat/comunidade-cards-sociais]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/lib/communityGroups.test.js
      - run: npm run build
